name: release

# Performix release pipeline.
#
# Windows-only: the product targets net10.0-windows / net10.0-windows10.0.22621.0 with WinUI 3
# (Windows App SDK). There is no Linux/macOS build, and the runner needs a real Windows SDK.
#
# ---------------------------------------------------------------------------------------------
# RISK - a token WITHOUT the `workflow` scope cannot push this file.
# ---------------------------------------------------------------------------------------------
# The token configured in this checkout today is a `gh` OAuth token whose scopes are
# `gist, read:org, repo` - it does NOT carry `workflow`. GitHub rejects any push that creates or
# edits a file under .github/workflows/ with:
#
#     refusing to allow an OAuth App to create or update workflow
#     `.github/workflows/release.yml` without `workflow` scope
#
# So this workflow is written to be correct, but it cannot be pushed with the current credential.
# Fix on the publishing machine, then push again:
#     gh auth refresh -h github.com -s workflow        # add the scope to the OAuth token
# or use a fine-grained PAT / GitHub App token that includes "Workflows: write".
# Background: commit 5170e5c "ci: park workflow as example until token has workflow scope",
# which is why docs/ci-build.yml.example still carries a .example suffix.
#
# ---------------------------------------------------------------------------------------------
# What one run does (same order as docs/RELEASE.md, which is the contract):
#   1. restore + build + test the solution
#   2. scripts/build-app-zip.ps1   -> artifacts/Performix-win-x64.zip
#      scripts/build-installer.ps1 -> artifacts/PerformixSetup.exe
#   3. scripts/get-release-notes.ps1 -> artifacts/release-notes.md
#      (the CHANGELOG.md section for this version, or a short template - never a git log dump,
#       which is unreadable on the Release page and drags in commits from earlier releases.
#       docs/RELEASE.md section 5.1)
#   4. scripts/publish-release.ps1 -DryRun -SkipBuild -> artifacts/update.json
#      (dry run on purpose: the script computes the real sha256/size and writes the manifest,
#       but the remote steps run here, in this workflow, not inside the script.)
#   5. upload the three assets to the GitHub Release.
#   6. commit that same manifest back to the default branch as github-actions[bot].
#      The three GitHub proxies read the REPOSITORY copy, not the release asset, so without this
#      step they keep serving whatever was committed last - a manifest describing a different
#      build - and every accelerated download fails the sha256 gate. That is exactly what broke
#      0.1.0-alpha.2 (local a8d5e3.../33490261 bytes vs CI 3d5048.../33489786 bytes).
#
# The release always carries THREE assets: the app zip, the amd64 installer and update.json.
# Only the zip is listed in the manifest's assets[]; the installer is not an update asset.
#
# Triggers:
#   - push of a v* tag  (the normal path; the tag name is the version, minus the leading v)
#   - workflow_dispatch (re-run a build, publish a version, or a dry run that uploads nothing)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 0.1.0-alpha.3'
        required: true
        type: string
      channel:
        description: 'Manifest channel (alpha is the only channel published today)'
        required: false
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - stable
      dry_run:
        description: 'Build and generate update.json, but do not tag or upload a release'
        required: false
        default: false
        type: boolean

# softprops/action-gh-release needs this to create the release and upload assets; the final step
# needs it to push the manifest commit to the default branch.
permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

concurrency:
  # One release per tag; a queued re-run waits instead of racing the upload.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not for release notes (those come from CHANGELOG.md): the last step
          # commits to the default branch, and tag lookups must not run against a shallow clone.
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK
        run: dotnet --info

      - name: Resolve version, channel and tag
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = "$env:INPUT_VERSION".Trim()
            $channel = "$env:INPUT_CHANNEL".Trim()
          } else {
            # Tag push: v0.1.0-alpha.3 -> version 0.1.0-alpha.3, channel from the suffix.
            $version = "$env:REF_NAME" -replace '^v', ''
            if ($version -match '-alpha') { $channel = 'alpha' }
            elseif ($version -match '-beta') { $channel = 'beta' }
            else { $channel = 'stable' }
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'version is empty: push a v* tag or pass the version input'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.]+)?$') {
            throw "version '$version' is not x.y.z or x.y.z-suffix"
          }
          if ($channel -notin @('alpha', 'beta', 'stable')) {
            throw "channel '$channel' must be alpha, beta or stable"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version channel=$channel tag=v$version"

      - name: Restore
        run: dotnet restore Performix.slnx

      - name: Build solution
        run: dotnet build Performix.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/Performix.Tests/Performix.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=performix-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/performix-tests.trx'
          if-no-files-found: ignore

      # x64 Release publish with -p:Version injected; writes artifacts/Performix-win-x64.zip with
      # Performix.exe at the zip root, and prints the sha256/size the manifest needs.
      - name: Build app package
        run: >
          pwsh -NoProfile -File scripts/build-app-zip.ps1 -Version '${{ steps.ver.outputs.version }}'

      # artifacts/PerformixSetup.exe. scripts/build-installer.ps1 is owned by the installer
      # workstream; this step only relies on the documented output path.
      - name: Build installer
        run: |
          if (-not (Test-Path scripts/build-installer.ps1)) {
            throw 'scripts/build-installer.ps1 is missing; it owns artifacts/PerformixSetup.exe'
          }
          $installerArgs = @()
          $declared = (Get-Command ./scripts/build-installer.ps1).Parameters.Keys
          if ($declared -contains 'Version') { $installerArgs += @('-Version', '${{ steps.ver.outputs.version }}') }
          pwsh -NoProfile -File ./scripts/build-installer.ps1 @installerArgs
          if ($LASTEXITCODE -ne 0) { throw "build-installer.ps1 failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path artifacts/PerformixSetup.exe)) {
            throw 'the installer build did not produce artifacts/PerformixSetup.exe'
          }

      # Release notes are the CHANGELOG.md section for this version. The previous version of this
      # step ran `git log --pretty=format:'- %s'`, which put a wall of commit subjects on the
      # Release page and included work that had shipped in an earlier release. scripts/
      # get-release-notes.ps1 falls back to a short template (version + one summary line + a link
      # to CHANGELOG.md) when the section is missing, so a release never fails on notes.
      # The same file becomes update.json's "notes" field further down (docs/RELEASE.md 4).
      - name: Generate release notes
        run: |
          pwsh -NoProfile -File scripts/get-release-notes.ps1 `
            -Version '${{ steps.ver.outputs.version }}' `
            -Changelog CHANGELOG.md `
            -OutputFile artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "get-release-notes.ps1 failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path artifacts/release-notes.md)) { throw 'the release notes were not written' }
          Get-Content artifacts/release-notes.md -Raw

      # The manifest is written by the same script a local release uses, so field rules
      # (schema=1, channel, publishedAt, notes, assets[] with name/url/sizeBytes/sha256, UTF-8
      # without BOM) cannot drift between CI and a workstation. -SkipBuild: the artifacts above
      # are final. -DryRun: stop before tag/push/upload - this workflow does those itself.
      - name: Generate update.json
        run: |
          pwsh -NoProfile -File scripts/publish-release.ps1 `
            -Version '${{ steps.ver.outputs.version }}' `
            -Channel '${{ steps.ver.outputs.channel }}' `
            -Tag '${{ steps.ver.outputs.tag }}' `
            -NotesFile artifacts/release-notes.md `
            -SkipBuild `
            -DryRun
          if ($LASTEXITCODE -ne 0) { throw "publish-release.ps1 failed (exit $LASTEXITCODE)" }
          $channel = '${{ steps.ver.outputs.channel }}'
          if ($channel -eq 'alpha') { $manifest = 'artifacts/update.json' }
          else { $manifest = "artifacts/update-$channel.json" }
          if (-not (Test-Path $manifest)) { throw "the manifest was not written: $manifest" }
          Get-Content $manifest -Raw

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: performix-${{ steps.ver.outputs.version }}
          path: |
            artifacts/Performix-win-x64.zip
            artifacts/PerformixSetup.exe
            artifacts/update*.json
          if-no-files-found: error

      - name: Tag the commit
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          git rev-parse -q --verify "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            git tag $tag
            git push origin $tag
            Write-Host "pushed tag $tag"
          } else {
            Write-Host "tag $tag already exists"
          }

      # Three assets, exactly: app zip + amd64 installer + manifest. --prerelease follows the
      # channel (alpha/beta/rc are pre-releases, stable is not) - docs/RELEASE.md section 5.
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Performix ${{ steps.ver.outputs.version }}
          body_path: artifacts/release-notes.md
          prerelease: ${{ steps.ver.outputs.channel != 'stable' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/Performix-win-x64.zip
            artifacts/PerformixSetup.exe
            artifacts/update*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 6 of the run (see the header). gh-proxy, ghproxy.net and jsDelivr read update.json
      # from the DEFAULT BRANCH; only the github-releases source reads the release asset. This
      # job rebuilt the zip, so the manifest above describes the CI bytes - and if the repository
      # copy still describes the last workstation build, every accelerated download fails the
      # sha256 gate. 0.1.0-alpha.2 shipped exactly that way and had to be fixed by hand.
      #
      # Idempotent: an identical manifest produces no commit. Runs after the release exists, so a
      # failed upload never leaves the branch pointing at a manifest for an asset that is not there.
      - name: Sync the manifest to the default branch
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:CHANNEL -eq 'alpha') { $manifestName = 'update.json' }
          else { $manifestName = 'update-' + $env:CHANNEL + '.json' }
          $source = Join-Path 'artifacts' $manifestName
          if (-not (Test-Path $source)) { throw "the manifest was not written: $source" }

          $branch = $env:DEFAULT_BRANCH
          if ([string]::IsNullOrWhiteSpace($branch)) { $branch = 'main' }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The checkout is a detached HEAD on the tag. Work on a throwaway branch that tracks the
          # default branch, so nothing is ever pushed onto the tag's commit. artifacts/ is ignored
          # by git, so switching branches leaves the built files alone.
          git fetch origin $branch
          git checkout -B release-manifest "origin/$branch"

          Copy-Item -LiteralPath $source -Destination $manifestName -Force
          git add -- $manifestName
          git diff --cached --quiet -- $manifestName
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$manifestName already matches this release; nothing to commit"
            exit 0
          }

          # [skip ci]: this workflow only listens for v* tags and workflow_dispatch, so the push
          # cannot loop back into it - the marker is for any workflow that does watch the branch.
          git commit -m "release: $manifestName for $env:VERSION [skip ci]" -- $manifestName

          # The branch can move while this job builds (60 minute timeout). Rebase and retry
          # instead of failing a finished release on a lost race.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin "HEAD:$branch"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "could not push $manifestName to $branch" }
            Write-Host "push attempt $attempt failed; rebasing on origin/$branch"
            git fetch origin $branch
            git rebase "origin/$branch"
            if ($LASTEXITCODE -ne 0) { git rebase --abort; throw "rebase onto origin/$branch failed" }
          }
          Write-Host "committed $manifestName ($env:VERSION) to $branch"
          Write-Host "the proxies read $branch/$manifestName - give the CDNs a minute before checking them"

# ---------------------------------------------------------------------------------------------
# NOT done here, on purpose:
#   * npm publish (docs/RELEASE.md section 6) - needs a registry credential.
#   * The one real-machine update test (docs/RELEASE.md section 8.3).
#
# The manifest commit to the default branch IS done here now (the step above). It used to be
# left to a workstation run of scripts/publish-release.ps1, which is what let the repository
# copy and the release asset describe two different builds.
# ---------------------------------------------------------------------------------------------
