competitors:
  - id: GHelper
    kind: scheduled_task
    trigger: logon
    principal: Interactive
    run_level: highest
    state: running
    note: "替代奥创后留下的主任务；登录即启动，随时可能回来抢同一族 WMI 通道"
    config:
      path: '%APPDATA%\GHelper\config.json'
      keys: 84
      groups: { performance: 3, fan: 10, limit: 12, gpu: 19, undervolt: 9, power: 6, autoapply: 6, aura: 3, display: 8, keyboard: 3, misc: 2 }
      ungrouped_keys: [cpu_temp_0, cpu_temp_1, cpu_temp_2]
      powermode: "指向「高性能」GUID 8c5e7fda…；本机 powercfg /L 只剩「平衡」→ 映射落空"
  - id: GHelperCharge
    kind: scheduled_task
    trigger: boot
    principal: S4U
    run_level: limited
    state: ready
  - id: ArmourySocketServer
    kind: service
    state: disabled
  - id: startup-surfaces
    kind: startup_entries
    state: empty
    note: "HKCU\\Run / HKLM\\Run / 启动文件夹均空 → 本机互斥检测只需盯上面两个计划任务（这是本机事实，不要推广成通用结论）"

status: read-only-probed
status_note: "远程真机只读探测完成；没有写入、没有订阅事件、没有启停服务"

trust:
  # ADR D9.6: T0 = 单台社区机器/单次只读探测；T1 = ≥3 台独立验证；T2 = 维护者实机。
  # This machine was probed once, remotely, read-only; nothing was written, so it is T0.
  # Consumers must NOT treat this level as write authorization.
  level: T0
  scope: single-machine-read-only
  verified_by: remote read-only probe
  verified_at: 2026-11-13
  write_verified: false

known_gaps:
  - "AsusHWMonitorWMI 访问被拒（类路径报「无法从客户端中访问 CIM 资源」；实例路径 ACPI\\PNP0C14\\AHWM_0 报「拒绝访问」）→ 多路传感器数值拿不到；没有做任何 ACL / 提权 / IOCTL 绕过"
  - "标准 WMI 无风扇（Win32_Fan / CIM_Fan 空）；唯一 ACPI 热区 TZ01 = 3552（≈82.1 °C）"
  - "WmiMonitorListedSupportedSourceModes 只报 2560×1600@60；实际 165Hz 走 DisplayID → 禁止用 EDID 枚举刷新率"
  - "powercfg /L 只剩「平衡」，G-Helper 的 powermode（高性能 GUID 8c5e7fda…）映射落空"
  - "SMBIOS 厂商 / 产品 / 主板串未采集（smbios_family 为 null），识别强度无法按 ADR D1 判定"
  - "DSDT 只在内存检索、未落盘；偏移（0x092C2 等）只对本次镜像有效，BIOS 更新必须重探"
  - "没有 docs/FINDINGS-FA607PI.md（ADR D9.5 要求每台受支持机型都有）；写入行为完全没有证据，信任等级不是 T2"

